name: Bundle Isolation Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bundle-isolation:
    name: Verify Sanity Studio Bundle Isolation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Disable telemetry during CI builds
          NEXT_TELEMETRY_DISABLED: 1
          # Minimal env vars needed for build
          NODE_ENV: production

      - name: Verify bundle isolation
        run: npm run analyze:bundle

      - name: Upload bundle analysis on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle-isolation-failure-${{ github.sha }}
          path: |
            .next/app-build-manifest.json
            .next/build-manifest.json
          retention-days: 7
