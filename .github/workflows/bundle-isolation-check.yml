name: Bundle Isolation Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bundle-isolation:
    name: Verify Sanity Studio Bundle Isolation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Disable telemetry during CI builds
          NEXT_TELEMETRY_DISABLED: 1
          # Minimal env vars needed for build
          NODE_ENV: production

      - name: Verify bundle isolation
        run: npm run analyze:bundle

      - name: Upload bundle analysis on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-isolation-failure-${{ github.sha }}
          path: |
            .next/app-build-manifest.json
            .next/build-manifest.json
          retention-days: 7
