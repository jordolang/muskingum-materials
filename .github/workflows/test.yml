name: Test Suite

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          # Optional: Use Redis for rate limiting if secrets are configured
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  e2e-rate-limiting:
    name: E2E Rate Limiting Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Next.js dev server
        run: PORT=3004 npm run dev &
        env:
          # Optional: Use Redis for rate limiting if secrets are configured
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Wait for server to be ready
        run: |
          echo "Waiting for dev server to start on port 3004..."
          max_attempts=30
          attempt=0
          while ! curl -s http://localhost:3004 > /dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Server failed to start after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Server not ready yet..."
            sleep 2
          done
          echo "Server is ready!"

      - name: Run rate limiting E2E tests
        run: bash ./test-rate-limits.sh

      - name: Stop dev server
        if: always()
        run: |
          # Kill all node processes (dev server)
          pkill -f "next dev" || true
